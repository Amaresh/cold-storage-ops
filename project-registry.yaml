projects:
  cold-storage-backend:
    repo: Amaresh/cold-storage-backend
    host: manual-crawler
    remote_dir: /opt/cold-storage-backend-src
    deploy_method: systemd-jar
    service_name: cold-storage-backend.service
    artifact_path: /srv/cold-storage-backend/app.jar
    health_check: curl -sf http://localhost:9090/actuator/health

  cold-storage-buyer-discovery:
    repo: Amaresh/cold-storage-buyer-discovery
    host: manual-crawler
    remote_dir: /opt/cold-storage-buyer-discovery
    deploy_method: systemd-timer
    service_name: cold-storage-buyer-discovery.service
    timer_name: cold-storage-buyer-discovery.timer
    env_file: /etc/cold-storage/cold-storage-buyer-discovery.env
    health_check: python3 /opt/cold-storage-buyer-discovery/run.py --list-sources

  cold-storage-webapp:
    repo: Amaresh/cold-storage-webapp
    host: manual-crawler
    remote_dir: /opt/cold-storage-webapp-src
    deploy_method: systemd-node
    service_name: cold-storage-webapp.service
    artifact_path: /srv/cold-storage-webapp
    health_check: curl -sf http://localhost:3000/healthz
    # Update public IP after manual-crawler restore (current: 157.245.105.32)
    public_health_check: curl -sf http://157.245.105.32/healthz

  cold-storage-wiki:
    repo: Amaresh/cold-storage-wiki
    host: manual-crawler
    remote_dir: /opt/cold-storage-wiki-src
    deploy_method: static-nginx
    publish_dir: /var/www/cold-storage-wiki/current
    nginx_port: 8094
    health_check: curl -sf http://127.0.0.1:8094/
    public_health_check: curl -sf http://157.245.105.32:8094/

